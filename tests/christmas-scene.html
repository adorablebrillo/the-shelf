<!doctype html>
<meta charset="utf-8">
<title>Christmas scene journey</title>
<h1>Christmas scene journey</h1>
<p>Run against the verification skill's made-up Christmas shelf on the same origin.</p>
<button id="run" type="button">Run ten journeys</button>
<button id="inspect" type="button">Inspect scroll areas</button>
<pre id="scroll-result">Not inspected</pre>
<pre id="result">Not run</pre>
<iframe id="shelf" title="Made-up Shelf" style="width:390px;height:844px"></iframe>
<script>
'use strict';
const frame=document.getElementById('shelf'), result=document.getElementById('result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function assert(ok,message){if(!ok)throw new Error(message);}
async function ready(){
  for(let i=0;i<100;i++){const d=frame.contentDocument,p=d&&d.querySelector('#christmas-play');if(p&&getComputedStyle(p).display!=='none'&&parseFloat(d.documentElement.style.getPropertyValue('--snow-frost'))>0)return d;await wait(100);}
  const d=frame.contentDocument, p=d&&d.querySelector('#christmas-play');
  throw new Error('The made-up Christmas shelf did not start snowfall: '+JSON.stringify({panel:!!p,display:p&&getComputedStyle(p).display,inline:p&&p.getAttribute('style'),parent:p&&p.parentElement.outerHTML.slice(0,300),frost:d&&d.documentElement.style.getPropertyValue('--snow-frost'),visibility:d&&d.visibilityState}));
}
async function journey(n){
  const width=n%2?390:1280;
  frame.style.width=width+'px';
  await new Promise(resolve=>{frame.onload=resolve;frame.src='/?christmas-journey='+n;});
  const d=await ready(), root=d.documentElement, q=s=>d.querySelector(s), buttons=Array.from(d.querySelectorAll('#christmas-play button'));
  assert(frame.contentWindow.innerWidth===width,'Requested viewport changed');
  assert(buttons.every(b=>{const r=b.getBoundingClientRect();return r.width>=44&&r.height>=44;}),'A scene button is smaller than 44 pixels');
  assert(getComputedStyle(q('#christmas-fall')).pointerEvents==='none','Snow captures reading clicks');
  assert(d.documentElement.scrollWidth<=frame.contentWindow.innerWidth,'The page overflows horizontally');
  const main=q('[data-m="main"]'), ledge=q('.snow-ledge-wrap'), nav=q('[data-m="bottomnav"]');
  const mainBox=main.getBoundingClientRect(), ledgeBox=ledge.getBoundingClientRect(), navBox=nav.getBoundingClientRect();
  const scrolls=getComputedStyle(main).overflowY==='auto', win=frame.contentWindow;
  if(scrolls)assert(mainBox.bottom<=ledgeBox.top+1,'The lower ledge covers the reading area');
  else{
    assert(root.scrollHeight>win.innerHeight,'On a phone the page does not scroll as a whole');
    const header=q('[data-m="side"]');win.scrollTo(0,0);assert(header.getBoundingClientRect().top>=0,'The phone header started off screen');
    win.scrollTo(0,root.scrollHeight);await wait(50);
    assert(header.getBoundingClientRect().bottom<=0,'The phone header stayed pinned instead of scrolling away');
    assert(q('[data-m="main"]').getBoundingClientRect().bottom<=ledgeBox.top+1,'The lower ledge covers the end of the reading area');
  }
  const trees=Array.from(d.querySelectorAll('[data-slot]'));
  assert(trees.length===3&&trees.every(b=>{const r=b.getBoundingClientRect();return r.top>=ledgeBox.top-1&&r.bottom<=ledgeBox.bottom+1&&r.height>=44&&d.elementFromPoint(r.left+r.width/2,r.top+r.height/2)===b;}),'The tree buttons are not reachable on the ledge');
  if(width===390)assert(ledgeBox.bottom<=navBox.top+1,'The lower ledge covers phone navigation');
  else assert(Math.abs(ledgeBox.bottom-frame.contentWindow.innerHeight)<=1,'The desktop ledge is not at the lower edge');
  assert(q('#christmas-play').parentElement===main,'Scene controls are outside the reading scroll area');
  if(scrolls)main.scrollTop=main.scrollHeight;else win.scrollTo(0,root.scrollHeight);
  await wait(50);
  const action=q('[data-snow="undo"]'), actionBox=action.getBoundingClientRect(), areaTop=scrolls?mainBox.top:0, areaBottom=scrolls?mainBox.bottom:ledge.getBoundingClientRect().top;
  assert(actionBox.top>=areaTop&&actionBox.bottom<=areaBottom,'Ordinary scrolling cannot reveal the scene controls');
  assert(d.elementFromPoint(actionBox.left+actionBox.width/2,actionBox.top+actionBox.height/2)===action,'The ledge covers the scene controls');
  const readingButton=q('[aria-label^="want to read"]');
  readingButton.focus();
  const readingBox=readingButton.getBoundingClientRect();
  assert(d.activeElement===readingButton&&readingBox.bottom<=areaBottom+1&&readingBox.top>=areaTop-1,'Keyboard focus is outside the reading area');
  const cover=q('[data-snow-cover="true"]'), frostStyle=frame.contentWindow.getComputedStyle(cover,'::after');
  assert(parseFloat(frostStyle.height)>0&&parseFloat(frostStyle.height)<=6,'Cover frost escaped its six-pixel band');
  cover.scrollIntoView();await wait(50);
  assert(parseFloat(frame.contentWindow.getComputedStyle(cover,'::after').height)<=6,'Cover frost changed size on scroll');
  const strip=q('.snow-brush-strip');
  assert(getComputedStyle(strip).pointerEvents==='none','The drift captures input outside brush mode');
  q('[data-snow="brush"]').click();
  assert(getComputedStyle(strip).pointerEvents==='auto'&&getComputedStyle(strip).touchAction==='none'&&strip.getBoundingClientRect().height===16,'Brush input is not limited to the drift strip');
  q('[data-snow="brush"]').click();
  q('[data-snow="pause"]').click();
  const frost=root.style.getPropertyValue('--snow-frost');
  q('[data-slot="0"]').click();q('[data-slot="1"]').click();q('[data-slot="2"]').click();q('[data-slot="1"]').click();
  assert(q('[data-slot="1"]').textContent==='Plant centre','The centre tree did not come out');
  q('[data-snow="undo"]').click();
  assert(Array.from(d.querySelectorAll('[data-slot]')).every(b=>b.textContent.startsWith('Remove')),'Undo did not restore the trees');
  const before=q('#snow-drift').getAttribute('d');q('[data-snow="sweep"]').click();
  assert(q('#snow-drift').getAttribute('d')!==before,'Sweep did not clear a path');
  q('[data-snow="plough"]').click();
  for(let i=0;i<80&&!q('#snow-status').textContent.includes('ground is clear');i++)await wait(100);
  assert(q('#snow-status').textContent.includes('ground is clear'),'The plough did not finish clearing the ground');
  assert(root.style.getPropertyValue('--snow-frost')===frost,'Plough removed book frost');
  assert(Array.from(d.querySelectorAll('[data-slot]')).every(b=>b.textContent.startsWith('Remove')),'Plough removed trees');
  q('[data-snow="clear"]').click();assert(root.style.getPropertyValue('--snow-frost')==='0px','Clear did not remove frost');
  q('[data-snow="undo"]').click();assert(root.style.getPropertyValue('--snow-frost')===frost,'Undo did not restore frost');
  q('[data-snow="effects"]').click();assert(getComputedStyle(q('#snow-scene')).display==='none','Effects off did not hide the scene');
  assert(frame.contentWindow.localStorage.getItem('shelf.christmas.effects')==='off','Effects preference was not kept');
  q('[data-snow="effects"]').click();assert(getComputedStyle(q('#snow-scene')).display!=='none','Effects on did not restore the scene');
  assert(Array.from(d.querySelectorAll('[data-slot]')).every(b=>b.textContent.startsWith('Remove')),'Effects toggle lost the trees');
  q('[data-snow="effects"]').click();
  await new Promise(resolve=>{frame.onload=resolve;frame.src='/?christmas-return='+n;});
  let returned;
  for(let i=0;i<100;i++){returned=frame.contentDocument.querySelector('[data-snow="effects"]');if(returned&&returned.textContent==='Effects off')break;await wait(100);}
  assert(returned&&returned.textContent==='Effects off','The effects preference did not survive reopening');
  returned.click();
  assert(Array.from(frame.contentDocument.querySelectorAll('[data-slot]')).every(b=>b.textContent.startsWith('Plant')),'Trees survived a page close');
}
document.getElementById('inspect').addEventListener('click',()=>{
  const d=frame.contentDocument, w=frame.contentWindow, m=d.querySelector('[data-m="main"]'), p=d.querySelector('#christmas-play'), l=d.querySelector('.snow-ledge-wrap');
  const rect=e=>{const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom};};
  document.getElementById('scroll-result').textContent=JSON.stringify({windowY:w.scrollY,documentHeight:d.documentElement.scrollHeight,viewportHeight:w.innerHeight,mainTop:m.scrollTop,mainHeight:m.clientHeight,mainScrollHeight:m.scrollHeight,main:rect(m),panel:rect(p),ledge:rect(l)});
});
document.getElementById('run').addEventListener('click',async()=>{
  result.textContent='Running';
  try{frame.contentWindow.localStorage.removeItem('shelf.christmas.effects');for(let i=1;i<=10;i++){await journey(i);result.textContent='Passed '+i+' of 10';}result.textContent='Passed 10 of 10 journeys';}
  catch(e){result.textContent='Failed: '+e.message;}
});
</script>
