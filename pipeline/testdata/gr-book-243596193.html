<!DOCTYPE html><html><head><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"apolloState":{"Contributor:kca://author/amzn1.gr.author.v1.LhTwlgJZTQECsKiMRxggjQ":{"__typename":"Contributor","id":"kca://author/amzn1.gr.author.v1.LhTwlgJZTQECsKiMRxggjQ","legacyId":15263414,"name":"Riley Sager","description":"Riley Sager is the New York Times bestselling author of ten novels, most recently WITH A VENGEANCE and MIDDLE OF THE NIGHT. His books have been published in more than 40 countries and have sold over 5 million copies worldwide. His latest novel, THE UNKNOWN, will be published in August.<br /><br />A native of Pennsylvania, he now lives in Princeton, New Jersey. When he's not writing, he enjoys reading, cooking and going to the movies as much as possible. His favorite film is \"Rear Window.\" Or maybe \"Jaws.\" But probably, if he's being honest, \"Mary Poppins.\"","isGrAuthor":true,"works":{"__typename":"ContributorWorksConnection","totalCount":30},"profileImageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/authors/1650816892i/15263414._UX200_CR0,44,200,200_.jpg","webUrl":"https://www.goodreads.com/author/show/15263414.Riley_Sager","viewerIsFollowing":null,"followers":{"__typename":"ContributorFollowersConnection","totalCount":64060},"user":{"__ref":"User:54588418"}},"Book:kca://book/amzn1.gr.book.v3.dLxk86gc6mav0BPC":{"__typename":"Book","id":"kca://book/amzn1.gr.book.v3.dLxk86gc6mav0BPC","legacyId":243596193,"webUrl":"https://www.goodreads.com/book/show/243596193-the-unknown","viewerShelving":null,"title":"The Unknown","titleComplete":"The Unknown","description":"In 1926, five women disappeared from a remote island in Vermont. Now, one hundred years later, it\u2019s happening again.<br /><br />Struggling actress Marin Keane is shocked when she lands a role in a major motion picture about the unsolved mystery of New Avalon, an island on sprawling Lake Faraday in Vermont. She\u2019s even more surprised when she learns that the role requires a weeklong research trip to that very spot.<br /><br />Because New Avalon isn\u2019t your ordinary island. A century ago, it was a commune for spiritual mediums\u2014until they all vanished in 1926. The only trace of them was five dresses hanging from the branches of an old oak tree in the middle of the island, one for each missing woman. Some locals say they simply left. Others think they were murdered. But the prevailing opinion, thanks to a diary left behind by one of the vanished, a young woman named Daisy Rue, is that a s\u00e9ance gone wrong conjured something supernatural that took them all one by one.<br /><br />Not long after arriving, Marin and her castmates, including legendary actress Violet Wright and white-hot director Ronan Peters, begin to realize all is not right with New Avalon. They hear strange noises in the night and notice mysterious symbols left behind by the island's previous occupants. And after a sudden health emergency leaves Marin, Ronan, and the other actors stranded on the island, the disappearances begin again.<br /><br />Is it the work of someone trying to derail the movie? Or is the island\u2019s alleged supernatural past catching up with the present? As fear and suspicion mount, Marin turns to Daisy\u2019s diary, hoping it holds the key to figuring out what really happened to the women of New Avalon\u2014and how to keep the island\u2019s terrible history from repeating itself.","description({\"stripped\":true})":"In 1926, five women disappeared from a remote island in Vermont. Now, one hundred years later, it\u2019s happening again.\r\n\r\nStruggling actress Marin Keane is shocked when she lands a role in a major motion picture about the unsolved mystery of New Avalon, an island on sprawling Lake Faraday in Vermont. She\u2019s even more surprised when she learns that the role requires a weeklong research trip to that very spot.\r\n\r\nBecause New Avalon isn\u2019t your ordinary island. A century ago, it was a c
